name: Build Android APK

# Builds an installable APK in the cloud. Trigger it from the "Actions" tab
# (Run workflow) or by pushing to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate and patch native projects
        run: bash tool/setup_platforms.sh

      - name: Static analysis
        run: flutter analyze
        continue-on-error: true

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: vettuvoli-apk
          path: build/app/outputs/flutter-apk/app-release.apk
