name: vettuvoli
description: "VettuVoli - offline, on-device audio noise removal for creators, students and vloggers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # UI / formatting
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Audio: record / play / process
  record: ^6.0.0
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  # FFmpegKit was retired upstream (Jan 2025); `ffmpeg_kit_flutter` is deprecated.
  # This maintained fork keeps the same API.
  ffmpeg_kit_flutter_new: ^4.1.0

  # Files, permissions, sharing
  path_provider: ^2.1.5
  path: ^1.9.0
  permission_handler: ^11.3.1
  file_picker: ^13.3.3
  share_plus: ^13.3.1

  # Local database
  sqflite: ^2.4.1
  uuid: ^4.5.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
